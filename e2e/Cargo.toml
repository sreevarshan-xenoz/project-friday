[package]
name = "friday-e2e"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FRIDAY Release 0.1 End-to-End Harness, Developer Console, and Trace Replay"

[dependencies]
friday-core = { path = "../core" }
friday-planner = { path = "../planner" }
friday-mcp = { path = "../mcp" }
friday-capabilities = { path = "../services/capabilities" }
friday-simulation = { path = "../services/simulation" }
friday-context = { path = "../services/context" }
friday-intelligence = { path = "../services/intelligence" }
friday-actions = { path = "../services/action-runtime" }
friday-agent-runtime = { path = "../services/agent-runtime" }
friday-windows = { path = "../plugins/windows" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
dotenvy = "0.15"
