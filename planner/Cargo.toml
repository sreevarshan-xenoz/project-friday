[package]
name = "friday-planner"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FRIDAY Planner: intent, planning, execution, and verification engines"

[dependencies]
friday-core = { path = "../core" }
friday-capabilities = { path = "../services/capabilities" }
friday-skills = { path = "../services/skills" }
friday-investigation = { path = "../services/investigation" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
chrono.workspace = true
anyhow = "1"
redb = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util", "macros"] }
tokio-tungstenite = { workspace = true }
futures = { workspace = true }
friday-mcp = { path = "../mcp" }
friday-actions = { path = "../services/action-runtime" }
tempfile = "3"
