name: Weekly model check

# Check FRIDAY's built-in free AI models (OpenCode Zen and Kilo) weekly.
# Verifies model reachability, latency, pong replies, and upstream catalog drift.
# A failed weekly run opens or comments on an issue.

on:
  schedule:
    - cron: "42 5 * * 2"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check free models and catalog drift
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      MODEL_CHECK_REPORT: target/model-check.md
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check built-in free models
        run: cargo test -p friday-intelligence -- --ignored model_check --nocapture
      - name: Publish step summary
        if: always()
        run: |
          if [ -f target/model-check.md ]; then
            cat target/model-check.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload check report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-check-report
          path: target/model-check.md
          if-no-files-found: ignore

  report:
    name: Open an issue when the weekly run fails
    needs: check
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue=$(gh issue list --repo "${{ github.repository }}" --state open --search "Weekly model check failed in:title" --json number,title --jq '.[] | select(.title == "Weekly model check failed") | .number' | head -n1)
          body="The weekly FRIDAY free AI models check failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Fewer than two built-in free models answered. Inspect the run summary and model-check-report artifact for failure details and upstream catalog drift."
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "Weekly model check failed" \
              --body "$body"
          fi
