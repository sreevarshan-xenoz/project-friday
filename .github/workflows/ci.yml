name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_call: # release.yml runs all of CI before building a release
  workflow_dispatch: # the weekly agent-desktop check starts CI on its pull request's branch

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (lint, test, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Build
        run: cargo build --all

  rust-linux:
    # The Linux daemon and every cfg(target_os = "linux") path (Hyprland
    # sensors, screen capture) are only compiled and tested here; the job
    # above runs on Windows.
    name: Rust on Linux (clippy, test)
    runs-on: ubuntu-latest
    env:
      # No debug info: the full workspace test build otherwise needs many GB.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --all -- -D warnings
      - name: Test
        run: cargo test --all
      - name: End-to-end ask (real daemon, fake model, no network)
        run: |
          cargo build -p friday-mobile --bin friday-linux-daemon --bin friday-ctl
          bash tests/e2e/ask.sh
      - name: End-to-end hotkeys (shipped keymaps, each key's command to its answer)
        run: |
          sudo apt-get install -y lua5.4
          bash tests/e2e/hotkeys.sh

  desktop:
    name: Desktop, installer & CLI checks (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install check dependencies
        run: |
          pacman -Syu --noconfirm --needed git gum jq libnotify python zsh lua kbd tzdata terminus-font \
            hyprland niri quickshell sway grim foot qt6-5compat qt6-imageformats qt6-multimedia \
            qt6-multimedia-ffmpeg qt6-virtualkeyboard qt6-quicktimeline qt6-svg \
            qt6-wayland qt6-positioning kirigami syntax-highlighting \
            ttf-material-symbols-variable noto-fonts ttf-jetbrains-mono-nerd
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Stage the pinned Omarchy checkout
        # Gitignored; build-iso.sh normally fetches it. The static group
        # verifies the Omarchy-theme Hyprland config against it.
        run: bash iso/friday/fetch-omarchy.sh
      - name: Run checks
        run: CHECK_WORK="$RUNNER_TEMP/friday-checks" bash iso/friday/test/run-checks.sh
      - name: Upload shell screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-checks
          path: ${{ runner.temp }}/friday-checks/shell/
          if-no-files-found: ignore

  package:
    name: Arch package (build, install, smoke test)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust namcap desktop-file-utils \
            jq fuzzel libnotify wl-clipboard curl openssl \
            hicolor-icon-theme libdrm libpipewire libxcb mesa wayland
      - uses: actions/checkout@v4
        with:
          # makepkg clones the checkout and counts commits for pkgver.
          fetch-depth: 0
      - name: Build with makepkg
        # makepkg refuses to run as root.
        run: |
          git config --system --add safe.directory '*'
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          runuser -u builder -- env RUSTFLAGS= makepkg --noconfirm
      - name: Smoke test the package
        run: bash packaging/arch/check-package.sh packaging/arch/friday-git-*.pkg.tar.zst
      - name: Build and smoke test Pocketdesk
        run: |
          cd packaging/arch/pocketdesk
          runuser -u builder -- makepkg --noconfirm
          cd ../../..
          bash packaging/arch/check-pocketdesk.sh packaging/arch/pocketdesk/pocketdesk-*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: friday-arch-package
          path: packaging/arch/*.pkg.tar.zst

  windows-installer:
    # The per-user MSI, end to end on a clean Windows runner: build it,
    # install it silently, check what it put where, run the tray's headless
    # smoke test (daemon + host start, state.json says running, friday-ctl
    # reaches the daemon), then uninstall and check it cleaned up.
    name: Windows installer (build, install, smoke test)
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          # build.ps1 numbers the MSI by commit count.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Tray logic tests
        run: dotnet test windows-tray/FridayTray.Tests
      - name: Build the MSI
        id: build
        env:
          RUSTFLAGS: ""
        run: installer/windows/build.ps1
      - name: Install silently
        run: |
          $p = Start-Process msiexec -ArgumentList '/i', '${{ steps.build.outputs.msi }}', '/qn', '/l*v', "$env:RUNNER_TEMP\install.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /i exited with $($p.ExitCode)" }
      - name: Check the install
        run: |
          $dir = "$env:LOCALAPPDATA\Programs\FRIDAY"
          foreach ($f in 'friday-tray.exe', 'friday-daemon.exe', 'friday-ctl.exe', 'friday-windows-host.exe', 'agent-desktop.exe', 'agent-desktop-LICENSE', 'LICENSE-MIT') {
            if (-not (Test-Path "$dir\$f")) { throw "missing $dir\$f" }
          }
          $run = (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run').FRIDAY
          if ($run -notlike "*friday-tray.exe*") { throw "no start-at-login entry (got '$run')" }
          $path = (Get-ItemProperty 'HKCU:\Environment').Path
          if ($path -notlike "*Programs\FRIDAY*") { throw "install folder is not on the user PATH (got '$path')" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\FRIDAY.lnk")) { throw "no Start menu shortcut" }
          # The options that are off unless asked for.
          if (Test-Path "$env:USERPROFILE\Desktop\FRIDAY.lnk") { throw "a default install made a desktop shortcut" }
          if (Test-Path 'HKCU:\Software\FRIDAY\Options') { throw "a default install turned on screen text" }
          Write-Host "installed to $dir with Run entry, PATH and shortcut (no desktop shortcut, no screen text)"
      - name: Administrator start-up task (the elevated half of the Settings switch)
        run: |
          # The runner is an administrator, so the tray's --apply-elevated mode
          # (what Settings runs through one Windows prompt) can run directly.
          $tray = "$env:LOCALAPPDATA\Programs\FRIDAY\friday-tray.exe"
          $me = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
          $p = Start-Process $tray -ArgumentList '--apply-elevated', 'on', "`"$me`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--apply-elevated on exited $($p.ExitCode)" }
          $xml = schtasks /Query /TN FRIDAY /XML | Out-String
          if ($LASTEXITCODE -ne 0 -or $xml -notmatch 'HighestAvailable' -or $xml -notmatch 'LogonTrigger') { throw "the FRIDAY task is not as expected:`n$xml" }
          if ($xml -notmatch [regex]::Escape($tray)) { throw "the task does not start $tray" }
          Write-Host "task FRIDAY: logon, highest available, starts $tray"
          $p = Start-Process $tray -ArgumentList '--apply-elevated', 'off', "`"$me`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "--apply-elevated off exited $($p.ExitCode)" }
          schtasks /Query /TN FRIDAY 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) { throw "the FRIDAY task is still there after turning it off" }
          Write-Host "task removed"
          # The last query failed on purpose; don't let it fail the step.
          exit 0
      - name: Opening an app by name (PATH, App Paths, the Start menu)
        run: |
          $host_exe = "$env:LOCALAPPDATA\Programs\FRIDAY\friday-windows-host.exe"
          # --resolve says what "open <name>" would start, without starting it.
          $r = & $host_exe --resolve notepad
          if ($LASTEXITCODE -ne 0 -or $r -notlike "*notepad.exe") { throw "notepad did not resolve: $r" }
          Write-Host "notepad -> $r"
          $r = & $host_exe --resolve "windows powershell"
          if ($LASTEXITCODE -ne 0) { throw "a Start menu shortcut name did not resolve: $r" }
          Write-Host "windows powershell -> $r"
          $r = & $host_exe --resolve "no-such-app-12345"
          if ($LASTEXITCODE -eq 0) { throw "an unknown app resolved to: $r" }
          Write-Host "unknown app -> $r (exit $LASTEXITCODE)"
          # The last command failed on purpose; don't let it fail the step.
          exit 0
      - name: FRIDAY's voice (pinned downloads; speaks into a folder, the runner has no speakers)
        run: |
          $ctl = "$env:LOCALAPPDATA\Programs\FRIDAY\friday-ctl.exe"
          & $ctl say --setup kitten
          if ($LASTEXITCODE -ne 0) { throw "friday-ctl say --setup exited $LASTEXITCODE" }
          $dump = "$env:RUNNER_TEMP\say-dump"
          $env:FRIDAY_SAY_DUMP = $dump
          & $ctl say "Hello from FRIDAY. This is a test of the voice. Nothing is played."
          if ($LASTEXITCODE -ne 0) { throw "friday-ctl say exited $LASTEXITCODE" }
          $wavs = @(Get-ChildItem $dump -Filter *.wav)
          if ($wavs.Count -lt 3) { throw "expected 3 spoken sentences, got $($wavs.Count)" }
          foreach ($w in $wavs) {
            $head = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes($w.FullName)[0..3])
            if ($head -ne 'RIFF' -or $w.Length -lt 20000) { throw "$($w.Name) is not audio ($($w.Length) bytes)" }
          }
          Write-Host "the voice spoke $($wavs.Count) sentences ($(($wavs | Measure-Object Length -Sum).Sum) bytes of audio)"
          # The default voice (Kokoro): installs, names its voices (Bella first) and speaks.
          & $ctl say --setup
          if ($LASTEXITCODE -ne 0) { throw "friday-ctl say --setup (the default voice) exited $LASTEXITCODE" }
          $names = (& $ctl say --voices) -join "`n"
          if ($names -notmatch '0 Bella') { throw "the default voice should start with Bella, got: $names" }
          Remove-Item $dump -Recurse -Force
          & $ctl say "Hello from FRIDAY. This is a test of the voice. Nothing is played."
          if ($LASTEXITCODE -ne 0) { throw "friday-ctl say (default voice) exited $LASTEXITCODE" }
          $wavs = @(Get-ChildItem $dump -Filter *.wav)
          if ($wavs.Count -lt 3) { throw "default voice: expected 3 spoken sentences, got $($wavs.Count)" }
          foreach ($w in $wavs) { if ($w.Length -lt 20000) { throw "default voice: $($w.Name) is too small ($($w.Length) bytes)" } }
          Write-Host "the default voice spoke $($wavs.Count) sentences"
          exit 0
      - name: Smoke test (tray --smoke)
        run: |
          $p = Start-Process "$env:LOCALAPPDATA\Programs\FRIDAY\friday-tray.exe" -ArgumentList '--smoke' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\friday\logs\smoke.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) {
            Get-ChildItem "$env:LOCALAPPDATA\friday\logs" -Filter *.log | ForEach-Object { Write-Host "--- $($_.Name)"; Get-Content $_.FullName -Tail 40 }
            throw "smoke test failed ($($p.ExitCode))"
          }
      - name: Screen capture (the host's --screenshot, used for "ask about the screen")
        run: |
          $host_exe = "$env:LOCALAPPDATA\Programs\FRIDAY\friday-windows-host.exe"
          $png = "$env:RUNNER_TEMP\screen.png"
          # Through cmd so the PNG bytes on stdout reach the file unaltered.
          cmd /c "`"$host_exe`" --screenshot > `"$png`""
          if ($LASTEXITCODE -ne 0) { throw "--screenshot exited $LASTEXITCODE" }
          $bytes = [System.IO.File]::ReadAllBytes($png)
          $sig = [byte[]](0x89, 0x50, 0x4E, 0x47, 0x0D, 0x0A, 0x1A, 0x0A)
          if ($bytes.Length -lt 100 -or (Compare-Object $bytes[0..7] $sig)) { throw "not a PNG ($($bytes.Length) bytes)" }
          Write-Host "captured a $($bytes.Length)-byte PNG of the desktop"
      - name: agent-desktop (bundled; reads what an app shows through UI Automation)
        run: |
          $exe = "$env:LOCALAPPDATA\Programs\FRIDAY\agent-desktop.exe"
          $v = & $exe version | ConvertFrom-Json
          if (-not $v.ok -or $v.version -notlike '2.*') { throw "agent-desktop version gave: $($v | ConvertTo-Json -Compress)" }
          Write-Host "agent-desktop $($v.data.version), output format $($v.version)"
          # What the runner's desktop shows is informational: a headless
          # session may list nothing, and that is not a failure here.
          $apps = & $exe list-apps | ConvertFrom-Json
          Write-Host "list-apps ok=$($apps.ok), $(@($apps.data.apps).Count) app(s)"
      - name: End-to-end ask on the installed binaries (fake model, no network)
        shell: bash
        run: bash tests/e2e/ask.sh "$LOCALAPPDATA/Programs/FRIDAY"
      - name: End-to-end desktop control (the real daemon and Windows host; fake model lists the windows)
        shell: bash
        run: bash tests/e2e/desktop.sh "$LOCALAPPDATA/Programs/FRIDAY"
      - name: End-to-end hotkeys (the tray, keys pressed on the desktop)
        run: pwsh tests/e2e/hotkeys.ps1
      - name: Uninstall silently
        run: |
          $p = Start-Process msiexec -ArgumentList '/x', '${{ steps.build.outputs.msi }}', '/qn', '/l*v', "$env:RUNNER_TEMP\uninstall.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited with $($p.ExitCode)" }
          if (Test-Path "$env:LOCALAPPDATA\Programs\FRIDAY\friday-tray.exe") { throw "files left behind" }
          # The installer may have created the Run key itself, so uninstall can
          # remove the whole key: a missing key means no entry.
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue
          if ($run -and ($run.PSObject.Properties.Name -contains 'FRIDAY')) { throw "start-at-login entry left behind" }
          Write-Host "uninstalled cleanly"
      - name: Custom install (options chosen on the command line)
        run: |
          # What the Customize page does, without the page: only the listed features.
          $msi = '${{ steps.build.outputs.msi }}'
          $p = Start-Process msiexec -ArgumentList '/i', $msi, '/qn', 'ADDLOCAL=Main,DesktopShortcut,ScreenText,AdminAccess', '/l*v', "$env:RUNNER_TEMP\custom.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /i ADDLOCAL exited with $($p.ExitCode)" }
          $run = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run' -ErrorAction SilentlyContinue
          if ($run -and ($run.PSObject.Properties.Name -contains 'FRIDAY')) { throw "start-at-login was left on though it was not chosen" }
          $path = (Get-ItemProperty 'HKCU:\Environment').Path
          if ($path -like "*Programs\FRIDAY*") { throw "PATH was changed though it was not chosen" }
          if (-not (Test-Path "$env:USERPROFILE\Desktop\FRIDAY.lnk")) { throw "the chosen desktop shortcut is missing" }
          if ((Get-ItemProperty 'HKCU:\Software\FRIDAY\Options').ScreenText -ne 1) { throw "the chosen screen-text option was not recorded" }
          if ((Get-ItemProperty 'HKCU:\Software\FRIDAY\Options').AdminAccess -ne 1) { throw "the chosen administrator option was not recorded" }
          Write-Host "custom install: desktop shortcut and screen text on; start-at-login and PATH off"
          $p = Start-Process msiexec -ArgumentList '/x', $msi, '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "msiexec /x exited with $($p.ExitCode)" }
          if (Test-Path "$env:USERPROFILE\Desktop\FRIDAY.lnk") { throw "the desktop shortcut was left behind" }
          if (Test-Path 'HKCU:\Software\FRIDAY') { throw "installer registry values were left behind" }
      - name: winget manifests
        run: |
          $msi = '${{ steps.build.outputs.msi }}'
          installer/windows/winget/New-WingetManifest.ps1 -Msi $msi -Url "https://example.invalid/$(Split-Path $msi -Leaf)"
          $dir = Get-ChildItem installer/windows/winget/manifests -Recurse -Filter ProjectFRIDAY.FRIDAY.yaml | Select-Object -First 1 | ForEach-Object DirectoryName
          if ((Get-ChildItem $dir -Filter *.yaml).Count -ne 3) { throw "expected 3 manifest files in $dir" }
          if (Get-Command winget -ErrorAction SilentlyContinue) {
            winget validate --manifest $dir
            if ($LASTEXITCODE -ne 0) { throw "winget validate failed" }
          } else {
            Write-Host "winget is not on this runner; manifests generated but not validated"
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: friday-windows-installer
          path: |
            installer/windows/out/*.msi
            ${{ runner.temp }}/*.log
            ${{ runner.temp }}/screen.png
            ${{ runner.temp }}/hotkeys-failure.png
          if-no-files-found: ignore

  python:
    name: Python (lint, type, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Ruff
        run: uvx ruff check .
      - name: Black
        run: uvx black --check .
      - name: Mypy
        run: uvx mypy .
      - name: Pytest
        # Exit 5 = no tests collected (there are none yet); any real failure fails CI.
        run: uvx pytest || [ $? -eq 5 ]
