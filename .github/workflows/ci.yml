name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (lint, test, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Build
        run: cargo build --all

  desktop:
    name: Desktop, installer & CLI checks (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install check dependencies
        run: |
          pacman -Syu --noconfirm --needed git gum jq libnotify python zsh lua kbd tzdata \
            quickshell sway grim foot qt6-5compat qt6-imageformats qt6-multimedia \
            qt6-multimedia-ffmpeg qt6-virtualkeyboard qt6-quicktimeline qt6-svg \
            qt6-wayland qt6-positioning kirigami syntax-highlighting \
            ttf-material-symbols-variable noto-fonts
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run checks
        run: CHECK_WORK="$RUNNER_TEMP/friday-checks" bash iso/friday/test/run-checks.sh
      - name: Upload shell screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-checks
          path: ${{ runner.temp }}/friday-checks/shell/
          if-no-files-found: ignore

  python:
    name: Python (lint, type, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Ruff
        run: uvx ruff check .
      - name: Black
        run: uvx black --check .
      - name: Mypy
        run: uvx mypy .
      - name: Pytest
        # Exit 5 = no tests collected (there are none yet); any real failure fails CI.
        run: uvx pytest || [ $? -eq 5 ]
