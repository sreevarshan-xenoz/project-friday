name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  rust:
    name: Rust (lint, test, build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all -- -D warnings
      - name: Test
        run: cargo test --all
      - name: Build
        run: cargo build --all

  rust-linux:
    # The Linux daemon and every cfg(target_os = "linux") path (Hyprland
    # sensors, screen capture) are only compiled and tested here; the job
    # above runs on Windows.
    name: Rust on Linux (clippy, test)
    runs-on: ubuntu-latest
    env:
      # No debug info: the full workspace test build otherwise needs many GB.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets --all -- -D warnings
      - name: Test
        run: cargo test --all

  desktop:
    name: Desktop, installer & CLI checks (Arch)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install check dependencies
        run: |
          pacman -Syu --noconfirm --needed git gum jq libnotify python zsh lua kbd tzdata \
            hyprland quickshell sway grim foot qt6-5compat qt6-imageformats qt6-multimedia \
            qt6-multimedia-ffmpeg qt6-virtualkeyboard qt6-quicktimeline qt6-svg \
            qt6-wayland qt6-positioning kirigami syntax-highlighting \
            ttf-material-symbols-variable noto-fonts ttf-jetbrains-mono-nerd
      - uses: actions/checkout@v4
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Stage the pinned Omarchy checkout
        # Gitignored; build-iso.sh normally fetches it. The static group
        # verifies the Omarchy-theme Hyprland config against it.
        run: bash iso/friday/fetch-omarchy.sh
      - name: Run checks
        run: CHECK_WORK="$RUNNER_TEMP/friday-checks" bash iso/friday/test/run-checks.sh
      - name: Upload shell screenshot and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-checks
          path: ${{ runner.temp }}/friday-checks/shell/
          if-no-files-found: ignore

  package:
    name: Arch package (build, install, smoke test)
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust namcap desktop-file-utils \
            jq fuzzel libnotify wl-clipboard curl openssl
      - uses: actions/checkout@v4
        with:
          # makepkg clones the checkout and counts commits for pkgver.
          fetch-depth: 0
      - name: Build with makepkg
        # makepkg refuses to run as root.
        run: |
          git config --system --add safe.directory '*'
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          runuser -u builder -- env RUSTFLAGS= makepkg --noconfirm
      - name: Smoke test the package
        run: bash packaging/arch/check-package.sh packaging/arch/friday-git-*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: friday-arch-package
          path: packaging/arch/*.pkg.tar.zst

  python:
    name: Python (lint, type, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Ruff
        run: uvx ruff check .
      - name: Black
        run: uvx black --check .
      - name: Mypy
        run: uvx mypy .
      - name: Pytest
        # Exit 5 = no tests collected (there are none yet); any real failure fails CI.
        run: uvx pytest || [ $? -eq 5 ]
