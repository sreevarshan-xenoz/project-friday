name: Check for new pinned tools

# FRIDAY offers tools from their own releases (packaging/tools/tools.json:
# `friday obscura install`), each a pinned version and checksum. Weekly, look
# for newer releases in the same series, download every pinned asset, record
# its sha256 and smoke-test the Linux build (packaging/tools/bump-tools.py).
# The new build runs only in the first job, which has a read-only token and
# keeps no credentials. Tools that pass become one pull request (second job,
# which never runs them) that moves only tools.json, and CI is started on its
# branch; CI decides, and a person merges. A new series or a failed check
# goes to an issue instead.

on:
  schedule:
    - cron: "41 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify new releases of pinned tools
    runs-on: ubuntu-latest
    outputs:
      rc: ${{ steps.bump.outputs.rc }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the releases
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: |
          set +e
          python3 packaging/tools/bump-tools.py
          rc=$?
          set -e
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
          mkdir -p out && cp packaging/tools/tools.json out/ && cp "$SUMMARY_FILE" out/summary.md 2>/dev/null || true
          [ -f out/summary.md ] && cat out/summary.md >>"$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        with:
          name: tools-check
          path: out/

  publish:
    name: Open a pull request or an issue
    needs: verify
    if: needs.verify.outputs.rc != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: tools-check
          path: ${{ runner.temp }}/check
      - name: Open the pull request
        if: needs.verify.outputs.rc == '10'
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK: ${{ runner.temp }}/check
        run: |
          cp "$CHECK/tools.json" packaging/tools/tools.json
          python3 -c "import json,sys; json.load(open('packaging/tools/tools.json'))"
          changed=$(git diff --name-only)
          [ "$changed" = "packaging/tools/tools.json" ] || { echo "::error::unexpected changes: $changed"; exit 1; }
          branch="bump/tools-$(sha256sum packaging/tools/tools.json | cut -c1-12)"
          open=$(gh pr list --repo "${{ github.repository }}" --head "$branch" --state open --json number --jq 'length')
          if [ "${open:-0}" -gt 0 ]; then echo "A pull request for $branch is already open."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add packaging/tools/tools.json windows-tray/FridayTray.Core/ObscuraInstaller.cs
          git commit -q -m "chore(tools): move pinned tools" -m "$(cat "$CHECK/summary.md")"
          git push -q origin "$branch"
          body="The weekly check verified new releases and moved their pins in \`packaging/tools/tools.json\` (versions and checksums only)."$'\n\n'"$(cat "$CHECK/summary.md")"$'\n\n'"CI was started on the branch by the workflow; merge when it is green. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh pr create --repo "${{ github.repository }}" --base dev --head "$branch" \
            --title "chore(tools): move pinned tools" --body "$body"
          gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$branch"
      - name: Report
        if: needs.verify.outputs.rc != '10'
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ needs.verify.outputs.rc }}
          CHECK: ${{ runner.temp }}/check
        run: |
          if [ "$RC" = 3 ]; then
            title="A pinned tool has a new series"
            lead="A new major (or, for 0.x, minor) version needs a person: read its release notes before moving the pin by hand."
          else
            title="Pinned tools check failed"
            lead="The weekly check could not verify a newer release. Treat this as a possible supply-chain problem until proven otherwise: do not move the pin."
          fi
          body="$lead"$'\n\n'"$(cat "$CHECK/summary.md" 2>/dev/null)"$'\n\n'"Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          issue=$(gh issue list --repo "${{ github.repository }}" --state open --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi
