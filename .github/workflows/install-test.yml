name: Install test

# Build the FRIDAY OS ISO, install it in QEMU/KVM and check the installed
# desktop (iso/friday/test/install-test.sh). The ISO downloads the desktop from
# the Arch mirrors at install time, so an install can break without any change
# here: this runs every week, and on changes to the installer or ISO profile.
# A failed weekly run opens an issue.

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/install-test.yml
      - iso/friday/airootfs/root/**
      - iso/friday/airootfs/etc/skel/**
      - iso/friday/packages.x86_64
      - iso/friday/profiledef.sh
      - iso/friday/build-iso.sh
      - iso/friday/fetch-omarchy.sh
      - iso/friday/omarchy-patches/**
      - iso/friday/test/install-test.sh

permissions:
  contents: read

jobs:
  install:
    name: Install the ISO and check the desktop
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Same build as release.yml: mkarchiso in a privileged Arch container,
      # build-iso.sh as a normal user with sudo for mkarchiso.
      - name: Build the ISO
        run: |
          mkdir -p "$RUNNER_TEMP/iso-work" "$RUNNER_TEMP/iso-out"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP/iso-work:/work" -v "$RUNNER_TEMP/iso-out:/out" \
            -w /src archlinux:latest bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed archiso base-devel git rust sudo
              git config --system --add safe.directory "*"
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >/etc/sudoers.d/builder
              chown -R builder /src /out
              runuser -u builder -- env RUSTFLAGS= WORK_DIR=/work/w OUT_DIR=/out bash iso/friday/build-iso.sh
            '
          sudo rm -rf "$RUNNER_TEMP/iso-work"
          ls -lh "$RUNNER_TEMP"/iso-out/*.iso
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Install QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils ovmf python3-pil >/dev/null
      - name: Install and check
        run: bash iso/friday/test/install-test.sh "$(ls "$RUNNER_TEMP"/iso-out/*.iso | head -n1)" "$RUNNER_TEMP/install-test"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: install-test
          path: ${{ runner.temp }}/install-test
          if-no-files-found: ignore

  report:
    name: Open an issue when the weekly run fails
    needs: install
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Weekly install test failed ($(date -u +%Y-%m-%d))" \
            --body "The weekly FRIDAY OS install test failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. The run's install-test artifact has the desktop screenshot, the installer log and the session journal. Likely cause: an Arch package update the pinned Omarchy or the installer doesn't handle yet."
