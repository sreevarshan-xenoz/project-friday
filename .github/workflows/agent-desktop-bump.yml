name: Check for a new agent-desktop

# FRIDAY ships a pinned agent-desktop (packaging/arch/PKGBUILD). Weekly, look
# for a newer release in the same major version and verify it: its checksum,
# that it is byte-identical to the npm package, npm's signature and build
# provenance for that package, and that the binary still has everything
# FRIDAY's engine uses (packaging/arch/bump-agent-desktop.sh). A release that
# passes becomes a pull request that moves only the three pin lines, and CI
# is started on its branch (a push by the workflow's token doesn't start it
# by itself); the package build and smoke test decide, and a person merges.
# Anything else (a new major version, a failed check) goes to an issue.

on:
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:
    inputs:
      version:
        description: "Check this version instead of the latest (X.Y.Z)"
        required: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  check:
    name: Verify the latest agent-desktop release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the release
        id: bump
        env:
          VERSION: ${{ github.event.inputs.version }}
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: |
          set +e
          args=()
          [ -n "$VERSION" ] && args+=(--version "$VERSION")
          bash packaging/arch/bump-agent-desktop.sh "${args[@]}"
          rc=$?
          set -e
          echo "rc=$rc" >>"$GITHUB_OUTPUT"
          [ -f "$SUMMARY_FILE" ] && cat "$SUMMARY_FILE" >>"$GITHUB_STEP_SUMMARY" || true
      - name: Open the pull request
        if: steps.bump.outputs.rc == '10'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: |
          new=$(sed -n 's/^_ad_ver=\(.*\)$/\1/p' packaging/arch/PKGBUILD | head -n1)
          [[ "$new" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::can't read the new version"; exit 1; }
          branch="bump/agent-desktop-$new"
          if gh pr list --repo "${{ github.repository }}" --head "$branch" --state open --json number --jq '.[0].number' | grep -q .; then
            echo "A pull request for $branch is already open."; exit 0
          fi
          # Only the pin may change.
          changed=$(git diff --name-only)
          [ "$changed" = "packaging/arch/PKGBUILD" ] || { echo "::error::unexpected changes: $changed"; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add packaging/arch/PKGBUILD
          git commit -q -m "chore(package): agent-desktop $new" -m "Verified by the weekly check (checksum, npm signature and provenance, the flags FRIDAY uses)."
          git push -q origin "$branch"
          body="The weekly check verified agent-desktop $new and moved the pin: \`packaging/arch/PKGBUILD\`, the version and two checksums, nothing else."$'\n\n'"$(cat "$SUMMARY_FILE" 2>/dev/null)"$'\n\n'"CI was started on the branch by the workflow; merge when the package build and smoke test are green. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          gh pr create --repo "${{ github.repository }}" --base dev --head "$branch" \
            --title "chore(package): agent-desktop $new" --body "$body"
          gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$branch"
      - name: Report
        if: steps.bump.outputs.rc != '0' && steps.bump.outputs.rc != '10'
        env:
          GH_TOKEN: ${{ github.token }}
          RC: ${{ steps.bump.outputs.rc }}
          SUMMARY_FILE: ${{ runner.temp }}/summary.md
        run: |
          case "$RC" in
            10) title="agent-desktop has a verified update"
                lead="A newer agent-desktop release passed every check below. To move the pin: \`bash packaging/arch/bump-agent-desktop.sh\`, commit \`packaging/arch/PKGBUILD\`, open a pull request, and let CI's package build and smoke test decide." ;;
            3)  title="agent-desktop has a new major version"
                lead="A new major version needs a person: FRIDAY's engine reads the 1.x output format. Read the release notes and the engine's parser before changing the pin." ;;
            *)  title="agent-desktop update check failed"
                lead="The weekly check could not verify a newer release. Treat this as a possible supply-chain problem until proven otherwise: do not move the pin." ;;
          esac
          body="$lead"$'\n\n'"$(cat "$SUMMARY_FILE" 2>/dev/null)"$'\n\n'"Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          issue=$(gh issue list --repo "${{ github.repository }}" --state open --json number,title --jq ".[] | select(.title == \"$title\") | .number" | head -n1)
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "${{ github.repository }}" --body "$body"
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
          fi
