name: Release

# Push a tag vX.Y.Z to publish FRIDAY: the Arch package and the Windows MSI
# are built, smoke-tested, and attached to a GitHub release with SHA-256
# sums and the winget manifests for that MSI (ready for microsoft/winget-pkgs).
#
# Versions: the MSI takes X.Y.Z from the tag. CI builds number the MSI
# 0.1.<commit count>, so a release must be newer than those (0.2.0 or later)
# for an installed CI build to upgrade to it.
#
# A release is only built from a commit that passes the whole of CI (ci.yml
# runs first, as a required job), and the tag must match the version in
# services/mobile/Cargo.toml, which the binaries and the Arch package report:
# bump it in its own commit before tagging.
#
# Dry run: a pull request that changes this workflow or the packaging, or a
# manual run, does everything above as version 0.0.<run number> except
# publish; the run summary lists what the release would carry. So the first
# real tag isn't this workflow's first run.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - installer/windows/**
      - packaging/arch/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::release tags look like v1.2.3 (got $tag)"; exit 1
            fi
            version="${BASH_REMATCH[1]}" publish=true
            crate=$(sed -n 's/^version *= *"\(.*\)"/\1/p' services/mobile/Cargo.toml | head -n1)
            if [[ "$crate" != "$version" ]]; then
              echo "::error::tag $tag but services/mobile/Cargo.toml says $crate: bump the crate version first"; exit 1
            fi
          else
            version="0.0.${GITHUB_RUN_NUMBER}" tag="v0.0.${GITHUB_RUN_NUMBER}" publish=false
            echo "::notice::dry run: building $tag, nothing is published"
          fi
          { echo "version=$version"; echo "tag=$tag"; echo "publish=$publish"; } >>"$GITHUB_OUTPUT"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  arch:
    name: Arch package
    needs: [version, ci]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust namcap desktop-file-utils \
            jq fuzzel libnotify wl-clipboard curl openssl
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build with makepkg
        run: |
          git config --system --add safe.directory '*'
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          runuser -u builder -- env RUSTFLAGS= makepkg --noconfirm
      - name: Smoke test the package
        run: bash packaging/arch/check-package.sh packaging/arch/friday-git-*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: release-arch
          path: packaging/arch/friday-git-*.pkg.tar.zst
          if-no-files-found: error

  windows:
    name: Windows MSI
    needs: [version, ci]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the MSI
        id: build
        run: installer/windows/build.ps1 -ReleaseVersion ${{ needs.version.outputs.version }}
      - name: Install, smoke test, uninstall
        run: |
          $msi = '${{ steps.build.outputs.msi }}'
          $p = Start-Process msiexec -ArgumentList '/i', $msi, '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install exited $($p.ExitCode)" }
          $p = Start-Process "$env:LOCALAPPDATA\Programs\FRIDAY\friday-tray.exe" -ArgumentList '--smoke' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\friday\logs\smoke.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoke test failed" }
          $p = Start-Process msiexec -ArgumentList '/x', $msi, '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exited $($p.ExitCode)" }
      - name: winget manifests for the published URL
        run: |
          $msi = '${{ steps.build.outputs.msi }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/$(Split-Path $msi -Leaf)"
          installer/windows/winget/New-WingetManifest.ps1 -Msi $msi -Url $url -Version ${{ needs.version.outputs.version }}
          winget validate --manifest "installer/windows/winget/manifests/p/ProjectFRIDAY/FRIDAY/${{ needs.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed" }
          Compress-Archive -Path installer/windows/winget/manifests/* -DestinationPath "installer/windows/out/winget-manifests-${{ needs.version.outputs.version }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            installer/windows/out/*.msi
            installer/windows/out/winget-manifests-*.zip
          if-no-files-found: error

  release:
    name: Publish the release
    needs: [version, arch, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - name: What the release carries
        working-directory: dist
        run: |
          {
            echo "### FRIDAY ${{ needs.version.outputs.version }} (${{ needs.version.outputs.publish == 'true' && 'published' || 'dry run, not published' }})"
            echo; echo '```'; ls -l; echo; cat SHA256SUMS; echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          for f in friday-git-*.pkg.tar.zst FRIDAY-*.msi winget-manifests-*.zip SHA256SUMS; do
            compgen -G "$f" >/dev/null || { echo "::error::the release is missing $f"; exit 1; }
          done
      - name: Create the GitHub release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "FRIDAY ${{ needs.version.outputs.version }}" \
            --generate-notes
