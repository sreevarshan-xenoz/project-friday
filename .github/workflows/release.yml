name: Release

# Push a tag vX.Y.Z to publish FRIDAY: the Arch package, the Windows MSI and
# the FRIDAY OS ISO are built, smoke-tested, and attached to a GitHub release
# with SHA-256 sums and the winget manifests for that MSI (ready for
# microsoft/winget-pkgs).
#
# A tag with a suffix (v0.2.0-alpha, v0.2.0-rc.1) is published as a
# pre-release; the MSI, the crate check and the ISO use the X.Y.Z part, and
# the final X.Y.Z MSI installs over its pre-releases.
#
# Versions: the MSI takes X.Y.Z from the tag. CI builds number the MSI
# 0.1.<commit count>, so a release must be newer than those (0.2.0 or later)
# for an installed CI build to upgrade to it.
#
# A release is only built from a commit that passes the whole of CI (ci.yml
# runs first, as a required job), and the tag must match the version in
# services/mobile/Cargo.toml, which the binaries and the Arch package report:
# bump it in its own commit before tagging.
#
# Dry run: a pull request that changes this workflow or the packaging, or a
# manual run, does everything above as version 0.0.<run number> except
# publish; the run summary lists what the release would carry. So the first
# real tag isn't this workflow's first run.

on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - installer/windows/**
      - packaging/arch/**
      - iso/friday/build-iso.sh
      - iso/friday/profiledef.sh
      - iso/friday/packages.x86_64
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      publish: ${{ steps.v.outputs.publish }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="${GITHUB_REF_NAME}"
            if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]]; then
              echo "::error::release tags look like v1.2.3 or v1.2.3-alpha (got $tag)"; exit 1
            fi
            version="${BASH_REMATCH[1]}" publish=true prerelease=false
            [[ -n "${BASH_REMATCH[2]}" ]] && prerelease=true
            crate=$(sed -n 's/^version *= *"\(.*\)"/\1/p' services/mobile/Cargo.toml | head -n1)
            if [[ "$crate" != "$version" ]]; then
              echo "::error::tag $tag but services/mobile/Cargo.toml says $crate: bump the crate version first"; exit 1
            fi
          else
            version="0.0.${GITHUB_RUN_NUMBER}" tag="v0.0.${GITHUB_RUN_NUMBER}" publish=false prerelease=false
            echo "::notice::dry run: building $tag, nothing is published"
          fi
          { echo "version=$version"; echo "tag=$tag"; echo "publish=$publish"; echo "prerelease=$prerelease"; } >>"$GITHUB_OUTPUT"

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  arch:
    name: Arch package
    needs: [version, ci]
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust namcap desktop-file-utils \
            jq fuzzel libnotify wl-clipboard curl openssl
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build with makepkg
        run: |
          git config --system --add safe.directory '*'
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          runuser -u builder -- env RUSTFLAGS= makepkg --noconfirm
      - name: Smoke test the package
        run: bash packaging/arch/check-package.sh packaging/arch/friday-git-*.pkg.tar.zst
      - uses: actions/upload-artifact@v4
        with:
          name: release-arch
          path: packaging/arch/friday-git-*.pkg.tar.zst
          if-no-files-found: error

  windows:
    name: Windows MSI
    needs: [version, ci]
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the MSI
        id: build
        run: installer/windows/build.ps1 -ReleaseVersion ${{ needs.version.outputs.version }}
      - name: Install, smoke test, uninstall
        run: |
          $msi = '${{ steps.build.outputs.msi }}'
          $p = Start-Process msiexec -ArgumentList '/i', $msi, '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install exited $($p.ExitCode)" }
          $p = Start-Process "$env:LOCALAPPDATA\Programs\FRIDAY\friday-tray.exe" -ArgumentList '--smoke' -Wait -PassThru
          Get-Content "$env:LOCALAPPDATA\friday\logs\smoke.log" -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { throw "smoke test failed" }
          $p = Start-Process msiexec -ArgumentList '/x', $msi, '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exited $($p.ExitCode)" }
      - name: winget manifests for the published URL
        run: |
          $msi = '${{ steps.build.outputs.msi }}'
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ needs.version.outputs.tag }}/$(Split-Path $msi -Leaf)"
          installer/windows/winget/New-WingetManifest.ps1 -Msi $msi -Url $url -Version ${{ needs.version.outputs.version }}
          winget validate --manifest "installer/windows/winget/manifests/p/ProjectFRIDAY/FRIDAY/${{ needs.version.outputs.version }}"
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed" }
          Compress-Archive -Path installer/windows/winget/manifests/* -DestinationPath "installer/windows/out/winget-manifests-${{ needs.version.outputs.version }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            installer/windows/out/*.msi
            installer/windows/out/winget-manifests-*.zip
          if-no-files-found: error

  iso:
    name: FRIDAY OS ISO
    needs: [version, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      # The image's work tree needs more room than the runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # mkarchiso needs root and mounts, so it runs in a privileged Arch
      # container; build-iso.sh itself runs as a normal user (makepkg refuses
      # root) with sudo for mkarchiso, as on a developer's machine.
      - name: Build the ISO
        run: |
          mkdir -p "$RUNNER_TEMP/iso-work" "$RUNNER_TEMP/iso-out"
          docker run --rm --privileged \
            -v "$GITHUB_WORKSPACE:/src" -v "$RUNNER_TEMP/iso-work:/work" -v "$RUNNER_TEMP/iso-out:/out" \
            -w /src archlinux:latest bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed archiso base-devel git rust sudo
              git config --system --add safe.directory "*"
              useradd -m builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >/etc/sudoers.d/builder
              chown -R builder /src /out
              runuser -u builder -- env RUSTFLAGS= WORK_DIR=/work/w OUT_DIR=/out bash iso/friday/build-iso.sh
            '
      - name: Name and size check
        run: |
          iso=$(ls "$RUNNER_TEMP"/iso-out/*.iso | head -n1)
          name="friday-os-${{ needs.version.outputs.version }}-x86_64.iso"
          sudo mv "$iso" "$RUNNER_TEMP/iso-out/$name"
          size=$(stat -c %s "$RUNNER_TEMP/iso-out/$name")
          echo "$name: $((size / 1048576)) MiB" | tee -a "$GITHUB_STEP_SUMMARY"
          # GitHub release assets are capped at 2 GiB.
          if (( size >= 2147483648 )); then
            echo "::error::the ISO is $((size / 1048576)) MiB, over GitHub's 2 GiB asset limit"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-iso
          path: ${{ runner.temp }}/iso-out/friday-os-*.iso
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish the release
    needs: [version, arch, windows, iso]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Only this workflow's release-* artifacts: the reused CI run uploads
      # its own (screenshots, logs) to the same run.
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum * | tee SHA256SUMS
      - name: What the release carries
        working-directory: dist
        run: |
          {
            echo "### FRIDAY ${{ needs.version.outputs.version }} (${{ needs.version.outputs.publish == 'true' && 'published' || 'dry run, not published' }})"
            echo; echo '```'; ls -l; echo; cat SHA256SUMS; echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          for f in friday-git-*.pkg.tar.zst FRIDAY-*.msi winget-manifests-*.zip friday-os-*.iso SHA256SUMS; do
            compgen -G "$f" >/dev/null || { echo "::error::the release is missing $f"; exit 1; }
          done
          for f in *; do
            case "$f" in
              friday-git-*.pkg.tar.zst|FRIDAY-*.msi|winget-manifests-*.zip|friday-os-*.iso|SHA256SUMS) ;;
              *) echo "::error::unexpected file in the release: $f"; exit 1 ;;
            esac
          done
      - name: Create the GitHub release
        if: needs.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" dist/* \
            --repo "${{ github.repository }}" \
            --title "FRIDAY ${{ needs.version.outputs.tag }}" \
            ${{ needs.version.outputs.prerelease == 'true' && '--prerelease' || '' }} \
            --generate-notes
