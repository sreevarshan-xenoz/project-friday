[package]
name = "friday-observability"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FRIDAY Cognitive Trace v1 -> OpenTelemetry adapter. OpenTelemetry is an EXPORT TARGET, not the source of truth."

[dependencies]
friday-core = { path = "../../core" }
opentelemetry = "0.27"
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "testing"] }
opentelemetry-otlp = { version = "0.27", optional = true, default-features = false, features = ["trace", "grpc-tonic"] }
chrono.workspace = true
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }

[features]
# Production OTLP (gRPC) sink. Off by default so the deterministic hermetic
# tests build/run without the heavy exporter or a live collector.
otlp = ["dep:opentelemetry-otlp", "opentelemetry_sdk/rt-tokio"]
