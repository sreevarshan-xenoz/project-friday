[package]
name = "friday-windows-qual"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FRIDAY Sprint 001A Windows Qualification Harness: IPC -> execute -> measure -> verify -> report"

[[bin]]
name = "windows-qual"
path = "src/main.rs"

[dependencies]
friday-windows = { path = "../../plugins/windows" }
friday-actions = { path = "../action-runtime" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
