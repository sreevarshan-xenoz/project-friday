[package]
name = "friday-mobile"
version = "0.2.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "FRIDAY daemon (friday-linux-daemon, friday-daemon.exe on Windows) and friday-ctl: runs asks, publishes state.json, token-gated loopback ingress"

[dependencies]
friday-core = { path = "../../core" }
friday-capabilities = { path = "../capabilities" }
friday-actions = { path = "../action-runtime" }
friday-goal-execution = { path = "../goal-execution" }
friday-cognitive = { path = "../cognitive" }
friday-sensors = { path = "../sensors" }
friday-intelligence = { path = "../intelligence" }
friday-investigation = { path = "../investigation" }
friday-context-collector = { path = "../context-collector" }
friday-windows = { path = "../../plugins/windows" }
async-trait = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
http = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
sysinfo = { workspace = true }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util", "macros"] }
