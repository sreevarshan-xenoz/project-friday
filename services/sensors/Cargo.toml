[package]
name = "friday-sensors"
version = "0.1.0"
edition = "2021"
description = "Platform-neutral sensor infrastructure for FRIDAY"

[dependencies]
friday-cognitive = { path = "../cognitive" }
async-trait = "0.1"
serde_json = "1"
# S8-B: the ASR seam runs whisper-cli off the async executor (spawn_blocking),
# so a ~0.65 s GPU transcription can never stall the sensor loop.
tokio = { version = "1", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Media_MediaFoundation",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
