# FRIDAY's fallback lock screen: friday lock uses this when it can't write
# its palette-coloured config (a full disk), so a lock request always locks.
general {
    hide_cursor = true
}
background {
    monitor =
    color = rgb(111318)
}
label {
    monitor =
    text = $TIME
    color = rgb(dde0e6)
    font_size = 72
    position = 0, 120
    halign = center
    valign = center
}
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    outer_color = rgb(d42d51)
    inner_color = rgba(181b21ee)
    font_color = rgb(dde0e6)
    placeholder_text = Password for $USER, then Enter
    fail_text = $PAMFAIL
    position = 0, -40
    halign = center
    valign = center
}
