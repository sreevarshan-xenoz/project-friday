<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Only root may own the service -->
  <policy user="root">
    <allow own="org.friday.Helper1"/>
  </policy>

  <!-- Any user may send messages to the service; polkit is the gate -->
  <policy context="default">
    <allow send_destination="org.friday.Helper1"/>
    <allow receive_sender="org.friday.Helper1"/>
  </policy>
</busconfig>
