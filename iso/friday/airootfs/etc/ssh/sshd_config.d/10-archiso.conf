# FRIDAY OS live system: SSH only with a key handed in at boot, as the
# ssh.authorized_keys.root credential (systemd's provision.conf writes it to
# /root/.ssh/authorized_keys). The test VMs pass one with QEMU's
# -smbios type=11,value=io.systemd.credential.binary:ssh.authorized_keys.root=<base64>.
# No passwords, and never an empty one: anyone on the network could log in.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
PermitEmptyPasswords no
