# Don't let a network without NTP (blocked port 123, captive portal, offline)
# hold boot forever: pacman-init.service is ordered after time-sync.target and
# the installer after multi-user.target, so without a cap neither ever runs.
# Wait at most 60s, then carry on as success: an unsynced clock is not a boot
# failure, and a failed unit would mark the live system "degraded".
[Service]
ExecStart=
ExecStart=-/usr/bin/timeout 60 /usr/lib/systemd/systemd-time-wait-sync
TimeoutStartSec=90
