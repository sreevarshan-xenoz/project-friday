# Live ISO only. systemd 262's udev rule asks systemd-loop@ to attach a
# GPT-auto-root CD-ROM to a loop device; the live medium is already mounted by
# archiso, the attach fails, and the live system reports "degraded". Skipping
# it here (a skipped unit is not a failure) has no effect on installed systems,
# where /run/archiso does not exist.
[Unit]
ConditionPathExists=!/run/archiso
