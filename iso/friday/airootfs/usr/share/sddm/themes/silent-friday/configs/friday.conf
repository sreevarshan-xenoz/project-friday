; FRIDAY OS Custom Edition of SilentSDDM
; Tokens: FRIDAY Core: Core Red (#D42D51), Silver (#B8BBC3), Platinum (#DDE0E6), Obsidian (#111318)

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "friday-horizon.jpg"
use-background-color = false
background-color = "#111318"
blur = 28
brightness = -0.05
saturation = 0.10
input-keystroke = false
ignore-shift-key = false

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "hh:mm"
font-family = "Michroma"
font-size = 76
font-weight = 400
color = "#dde0e6"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_US"
font-family = "Space Grotesk"
font-size = 15
font-weight = 600
color = "#b8bbc3"
margin-top = -10

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "FRIDAY OS  •  Press any key"
font-family = "Space Grotesk"
font-size = 13
font-weight = 500
display-icon = true
icon = "enter.svg"
icon-size = 18
color = "#dde0e6"
paint-icon = true
spacing = 6

[LoginScreen]
background = "friday-horizon.jpg"
use-background-color = false
background-color = "#111318"
blur = 18
brightness = -0.10
saturation = 0.05

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 120
inactive-size = 80
inactive-opacity = 0.40
active-border-size = 3
inactive-border-size = 1
active-border-color = "#d42d51"
inactive-border-color = "#343842"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "Space Grotesk"
font-size = 18
font-weight = 700
color = "#dde0e6"
margin = 12

[LoginScreen.LoginArea.PasswordInput]
width = 240
height = 36
display-icon = true
font-family = "Space Grotesk"
font-size = 13
icon = "password.svg"
icon-size = 18
content-color = "#dde0e6"
background-color = "#0c0e11"
background-opacity = 0.75
border-size = 1
border-color = "#d42d51"
border-radius-left = 10
border-radius-right = 10
margin-top = 12
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#d42d51"
background-opacity = 0.85
active-background-color = "#b8bbc3"
active-background-opacity = 0.95
icon = "arrow-right.svg"
icon-size = 18
content-color = "#fff4f6"
active-content-color = "#fff4f6"
border-size = 0
border-color = "#d42d51"
border-radius-left = 10
border-radius-right = 10
margin-left = 6
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "Space Grotesk"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Authenticating..."
font-family = "Space Grotesk"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#d42d51"
spacing = 6

[LoginScreen.LoginArea.WarningMessage]
font-family = "Space Grotesk"
font-size = 12
font-weight = 400
normal-color = "#d42d51"
warning-color = "#e8b04f"
error-color = "#ff5d6c"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 50
size = 32
border-radius = 6
spacing = 10
font-family = "Space Grotesk"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 32
item-spacing = 2
padding = 6
display-scrollbar = true
margin = 6
background-color = "#111318"
background-opacity = 0.92
active-option-background-color = "#d42d51"
active-option-background-opacity = 0.25
content-color = "#dde0e6"
active-content-color = "#d42d51"
font-family = "Space Grotesk"
border-size = 1
border-color = "#343842"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 200
popup-width = 220
background-color = "#111318"
background-opacity = 0.0
active-background-opacity = 0.35
content-color = "#dde0e6"
active-content-color = "#d42d51"
border-size = 0
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
background-color = "#111318"
background-opacity = 0.0
active-background-opacity = 0.35
content-color = "#dde0e6"
active-content-color = "#d42d51"
border-size = 0
font-size = 11
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-right"
index = 0
background-color = "#111318"
background-opacity = 0.0
active-background-opacity = 0.35
content-color = "#dde0e6"
active-content-color = "#d42d51"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 110
background-color = "#111318"
background-opacity = 0.0
active-background-opacity = 0.35
content-color = "#dde0e6"
active-content-color = "#ff5d6c"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#0c0e11"
background-opacity = 0.90
key-content-color = "#dde0e6"
key-color = "#111318"
key-opacity = 0.85
key-active-background-color = "#d42d51"
key-active-opacity = 0.40
selection-background-color = "#d42d51"
selection-content-color = "#fff4f6"
primary-color = "#d42d51"
border-size = 1
border-color = "#343842"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "Space Grotesk"
font-size = 11
content-color = "#dde0e6"
background-color = "#111318"
background-opacity = 0.85
border-radius = 6
disable-user = false
disable-login-button = false
