; FRIDAY OS Custom Edition of SilentSDDM
; Tokens: Deep Ice Blue (#7AA2F7), Soft Purple (#BB9AF7), Slate (#565F89), Dark Navy (#1A1B26)

[General]
scale = 1.0
enable-animations = true
animated-background-placeholder = ""
background-fill-mode = "fill"

[LockScreen]
display = true
padding-top = 0
padding-right = 0
padding-bottom = 0
padding-left = 0
background = "friday-cityscape.jpg"
use-background-color = false
background-color = "#1a1b26"
blur = 28
brightness = -0.05
saturation = 0.10
input-keystroke = false
ignore-shift-key = false

[LockScreen.Clock]
display = true
position = "top-center"
align = "center"
format = "hh:mm"
font-family = "JetBrainsMono Nerd Font"
font-size = 76
font-weight = 900
color = "#7aa2f7"

[LockScreen.Date]
display = true
format = "dddd, MMMM dd, yyyy"
locale = "en_US"
font-family = "JetBrainsMono Nerd Font"
font-size = 15
font-weight = 600
color = "#bb9af7"
margin-top = -10

[LockScreen.Message]
display = true
position = "bottom-center"
align = "center"
text = "FRIDAY OS  •  Press any key"
font-family = "JetBrainsMono Nerd Font"
font-size = 13
font-weight = 500
display-icon = true
icon = "enter.svg"
icon-size = 18
color = "#c0caf5"
paint-icon = true
spacing = 6

[LoginScreen]
background = "friday-cityscape.jpg"
use-background-color = false
background-color = "#1a1b26"
blur = 18
brightness = -0.10
saturation = 0.05

[LoginScreen.LoginArea]
position = "center"
margin = -1

[LoginScreen.LoginArea.Avatar]
shape = "circle"
border-radius = 35
active-size = 120
inactive-size = 80
inactive-opacity = 0.40
active-border-size = 3
inactive-border-size = 1
active-border-color = "#7aa2f7"
inactive-border-color = "#565f89"
always-active = false

[LoginScreen.LoginArea.Username]
font-family = "JetBrainsMono Nerd Font"
font-size = 18
font-weight = 700
color = "#c0caf5"
margin = 12

[LoginScreen.LoginArea.PasswordInput]
width = 240
height = 36
display-icon = true
font-family = "JetBrainsMono Nerd Font"
font-size = 13
icon = "password.svg"
icon-size = 18
content-color = "#c0caf5"
background-color = "#15161e"
background-opacity = 0.75
border-size = 1
border-color = "#7aa2f7"
border-radius-left = 10
border-radius-right = 10
margin-top = 12
masked-character = "●"

[LoginScreen.LoginArea.LoginButton]
background-color = "#7aa2f7"
background-opacity = 0.85
active-background-color = "#bb9af7"
active-background-opacity = 0.95
icon = "arrow-right.svg"
icon-size = 18
content-color = "#1a1b26"
active-content-color = "#1a1b26"
border-size = 0
border-color = "#7aa2f7"
border-radius-left = 10
border-radius-right = 10
margin-left = 6
show-text-if-no-password = true
hide-if-not-needed = false
font-family = "JetBrainsMono Nerd Font"
font-size = 12
font-weight = 600

[LoginScreen.LoginArea.Spinner]
display-text = true
text = "Authenticating..."
font-family = "JetBrainsMono Nerd Font"
font-weight = 600
font-size = 14
icon-size = 30
icon = "spinner.svg"
color = "#7aa2f7"
spacing = 6

[LoginScreen.LoginArea.WarningMessage]
font-family = "JetBrainsMono Nerd Font"
font-size = 12
font-weight = 400
normal-color = "#7aa2f7"
warning-color = "#e0af68"
error-color = "#f7768e"
margin-top = 10

[LoginScreen.MenuArea.Buttons]
margin-top = 50
margin-right = 50
margin-bottom = 50
margin-left = 50
size = 32
border-radius = 6
spacing = 10
font-family = "JetBrainsMono Nerd Font"

[LoginScreen.MenuArea.Popups]
max-height = 300
item-height = 32
item-spacing = 2
padding = 6
display-scrollbar = true
margin = 6
background-color = "#1a1b26"
background-opacity = 0.92
active-option-background-color = "#7aa2f7"
active-option-background-opacity = 0.25
content-color = "#c0caf5"
active-content-color = "#7aa2f7"
font-family = "JetBrainsMono Nerd Font"
border-size = 1
border-color = "#565f89"
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Session]
display = true
position = "bottom-left"
index = 0
popup-direction = "up"
popup-align = "center"
display-session-name = true
button-width = 200
popup-width = 220
background-color = "#1a1b26"
background-opacity = 0.0
active-background-opacity = 0.35
content-color = "#c0caf5"
active-content-color = "#7aa2f7"
border-size = 0
font-size = 11
icon-size = 16

[LoginScreen.MenuArea.Layout]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 180
display-layout-name = true
background-color = "#1a1b26"
background-opacity = 0.0
active-background-opacity = 0.35
content-color = "#c0caf5"
active-content-color = "#7aa2f7"
border-size = 0
font-size = 11
icon = "language.svg"
icon-size = 16

[LoginScreen.MenuArea.Keyboard]
display = true
position = "bottom-right"
index = 0
background-color = "#1a1b26"
background-opacity = 0.0
active-background-opacity = 0.35
content-color = "#c0caf5"
active-content-color = "#7aa2f7"
border-size = 0
icon = "keyboard.svg"
icon-size = 16

[LoginScreen.MenuArea.Power]
display = true
position = "bottom-right"
index = 0
popup-direction = "up"
popup-align = "center"
popup-width = 110
background-color = "#1a1b26"
background-opacity = 0.0
active-background-opacity = 0.35
content-color = "#c0caf5"
active-content-color = "#f7768e"
border-size = 0
icon = "power.svg"
icon-size = 16

[LoginScreen.VirtualKeyboard]
scale = 1.0
position = "login"
start-hidden = true
background-color = "#15161e"
background-opacity = 0.90
key-content-color = "#c0caf5"
key-color = "#1a1b26"
key-opacity = 0.85
key-active-background-color = "#7aa2f7"
key-active-opacity = 0.40
selection-background-color = "#7aa2f7"
selection-content-color = "#1a1b26"
primary-color = "#7aa2f7"
border-size = 1
border-color = "#565f89"
restrict-input = "none"

[Tooltips]
enable = true
font-family = "JetBrainsMono Nerd Font"
font-size = 11
content-color = "#c0caf5"
background-color = "#1a1b26"
background-opacity = 0.85
border-radius = 6
disable-user = false
disable-login-button = false
