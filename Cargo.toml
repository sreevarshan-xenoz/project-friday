[workspace]
resolver = "2"
members = [
    "core",
    "planner",
    "services/action-runtime",
    "services/capabilities",
    "services/cognitive",
    "services/engines/perception",
    "services/engines/memory",
    "services/evaluation",
    "services/simulation",
    "services/benchmark",
    "services/recovery",
    "services/context",
    "services/intelligence",
    "services/provider-qual",
    "services/mobile",
    "e2e",
    "plugins/windows",
    "services/windows-qual",
    "mcp"
, "services/sensors", "services/knowledge", "services/reflection", "services/goal-execution", "services/plugin-runtime", "services/experience", "services/bridge"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["PROJECT FRIDAY"]
repository = "https://github.com/project-friday/friday"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
async-stream = "0.1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio-tungstenite = "0.24"
http = "1"
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
sysinfo = "0.33"
